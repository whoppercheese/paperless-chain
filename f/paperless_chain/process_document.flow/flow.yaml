summary: Process new Paperless document
description: >-
  Triggered by Paperless webhook. Fetches document, analyzes structure,
  generates metadata, LLM-chunks text, embeds with bge-m3 and stores in Qdrant.
value:
  same_worker: true
  preprocessor_module:
    id: preprocessor
    summary: Parse Paperless doc_url
    value:
      type: script
      path: f/paperless_chain/preprocess_webhook
  failure_module:
    id: failure
    summary: Notify on flow error and tag AI-Error
    value:
      type: script
      path: f/paperless_chain/handle_flow_failure
      input_transforms:
        error:
          type: javascript
          expr: "previous_result.error ?? previous_result"
        doc_id:
          type: javascript
          expr: flow_input.doc_id
  modules:
    - id: fetch
      summary: Fetch document from Paperless
      value:
        type: script
        path: f/paperless_chain/fetch_document
        input_transforms:
          doc_id:
            type: javascript
            expr: flow_input.doc_id
    - id: summarize
      summary: Summarize document and extract date with LLM
      value:
        type: script
        path: f/paperless_chain/summarize_document
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          text:
            type: javascript
            expr: results.fetch.text
          document_language:
            type: javascript
            expr: results.fetch.document_language
          added_date:
            type: javascript
            expr: results.fetch.added_date
    - id: derive_title
      summary: Derive title from document summary
      value:
        type: script
        path: f/paperless_chain/derive_title
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          summary:
            type: javascript
            expr: results.summarize.summary
          added_date:
            type: javascript
            expr: results.fetch.added_date
          document_language:
            type: javascript
            expr: results.fetch.document_language
    - id: filter_candidates_document_type
      summary: Filter document type candidates by embedding similarity
      value:
        type: script
        path: f/paperless_chain/filter_candidates
        input_transforms:
          summary:
            type: javascript
            expr: results.summarize.summary
          entity_type:
            type: javascript
            expr: "'document_type'"
    - id: laya_decide_document_type
      summary: "Laya call: decide document type"
      value:
        type: script
        path: f/paperless_chain/laya_decide
        input_transforms:
          summary:
            type: javascript
            expr: results.summarize.summary
          entity_type:
            type: javascript
            expr: "'document_type'"
          candidates:
            type: javascript
            expr: results.filter_candidates_document_type.candidates
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
    - id: gate_decision_document_type
      summary: Gate document type decision by confidence
      value:
        type: script
        path: f/paperless_chain/gate_decision
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          entity_type:
            type: javascript
            expr: "'document_type'"
          selected:
            type: javascript
            expr: results.laya_decide_document_type.selected
          candidates:
            type: javascript
            expr: results.laya_decide_document_type.candidates
    - id: save_entity_document_type
      summary: Save document type to Paperless if new
      value:
        type: script
        path: f/paperless_chain/save_entity
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          entity_type:
            type: javascript
            expr: "'document_type'"
          accepted:
            type: javascript
            expr: results.gate_decision_document_type.accepted
    - id: apply_warning_document_type
      summary: Apply AI-Warning tag if document type was rejected
      value:
        type: script
        path: f/paperless_chain/apply_status_tags
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          update_warnings:
            type: javascript
            expr: results.gate_decision_document_type.warnings
    - id: filter_candidates_correspondent
      summary: Filter correspondent candidates by embedding similarity
      value:
        type: script
        path: f/paperless_chain/filter_candidates
        input_transforms:
          summary:
            type: javascript
            expr: results.summarize.summary
          entity_type:
            type: javascript
            expr: "'correspondent'"
    - id: laya_decide_correspondent
      summary: "Laya call: decide correspondent"
      value:
        type: script
        path: f/paperless_chain/laya_decide
        input_transforms:
          summary:
            type: javascript
            expr: results.summarize.summary
          entity_type:
            type: javascript
            expr: "'correspondent'"
          candidates:
            type: javascript
            expr: results.filter_candidates_correspondent.candidates
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
    - id: gate_decision_correspondent
      summary: Gate correspondent decision by confidence
      value:
        type: script
        path: f/paperless_chain/gate_decision
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          entity_type:
            type: javascript
            expr: "'correspondent'"
          selected:
            type: javascript
            expr: results.laya_decide_correspondent.selected
          candidates:
            type: javascript
            expr: results.laya_decide_correspondent.candidates
    - id: save_entity_correspondent
      summary: Save correspondent to Paperless if new
      value:
        type: script
        path: f/paperless_chain/save_entity
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          entity_type:
            type: javascript
            expr: "'correspondent'"
          accepted:
            type: javascript
            expr: results.gate_decision_correspondent.accepted
    - id: apply_warning_correspondent
      summary: Apply AI-Warning tag if correspondent was rejected
      value:
        type: script
        path: f/paperless_chain/apply_status_tags
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          update_warnings:
            type: javascript
            expr: results.gate_decision_correspondent.warnings
    - id: filter_candidates_tag
      summary: Filter tag candidates by embedding similarity
      value:
        type: script
        path: f/paperless_chain/filter_candidates
        input_transforms:
          summary:
            type: javascript
            expr: results.summarize.summary
          entity_type:
            type: javascript
            expr: "'tag'"
    - id: laya_decide_tag
      summary: "Laya call: decide tags"
      value:
        type: script
        path: f/paperless_chain/laya_decide
        input_transforms:
          summary:
            type: javascript
            expr: results.summarize.summary
          entity_type:
            type: javascript
            expr: "'tag'"
          candidates:
            type: javascript
            expr: results.filter_candidates_tag.candidates
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
    - id: gate_decision_tag
      summary: Gate tag decision by confidence
      value:
        type: script
        path: f/paperless_chain/gate_decision
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          entity_type:
            type: javascript
            expr: "'tag'"
          selected:
            type: javascript
            expr: results.laya_decide_tag.selected
          candidates:
            type: javascript
            expr: results.laya_decide_tag.candidates
    - id: save_entity_tag
      summary: Save tags to Paperless if new
      value:
        type: script
        path: f/paperless_chain/save_entity
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          entity_type:
            type: javascript
            expr: "'tag'"
          accepted:
            type: javascript
            expr: results.gate_decision_tag.accepted
    - id: apply_warning_tag
      summary: Apply AI-Warning tag if tags were rejected
      value:
        type: script
        path: f/paperless_chain/apply_status_tags
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          update_warnings:
            type: javascript
            expr: results.gate_decision_tag.warnings
    - id: update
      summary: Update Paperless metadata
      value:
        type: script
        path: f/paperless_chain/update_paperless
        input_transforms:
          doc_id:
            type: javascript
            expr: results.derive_title.doc_id
          title:
            type: javascript
            expr: results.derive_title.title
          selected_correspondent:
            type: javascript
            expr: "(results.save_entity_correspondent?.saved || [])[0]"
          existing_tags:
            type: javascript
            expr: results.fetch.existing_tags
          current_tag_ids:
            type: javascript
            expr: results.fetch.current_metadata.tag_ids
          existing_correspondents:
            type: javascript
            expr: results.fetch.existing_correspondents
          existing_document_types:
            type: javascript
            expr: results.fetch.existing_document_types
          selected_document_type:
            type: javascript
            expr: "(results.save_entity_document_type?.saved || [])[0]"
          document_date:
            type: javascript
            expr: results.summarize.document_date
          current_title:
            type: javascript
            expr: results.fetch.current_metadata.title
          current_correspondent_id:
            type: javascript
            expr: results.fetch.current_metadata.correspondent
          current_document_type_id:
            type: javascript
            expr: results.fetch.current_metadata.document_type
          summarize_warnings:
            type: javascript
            expr: results.summarize.warnings
          title_warnings:
            type: javascript
            expr: >-
              [...(results.derive_title.warnings || []),
              ...(results.gate_decision_document_type.warnings || []),
              ...(results.gate_decision_correspondent.warnings || []),
              ...(results.gate_decision_tag.warnings || [])]
          selected_tags:
            type: javascript
            expr: results.save_entity_tag?.saved
          created_document_type:
            type: javascript
            expr: "(results.save_entity_document_type?.created || [])[0]"
          created_correspondent:
            type: javascript
            expr: "(results.save_entity_correspondent?.created || [])[0]"
          created_tags:
            type: javascript
            expr: results.save_entity_tag?.created
    - id: chunk
      summary: LLM semantic chunking
      value:
        type: script
        path: f/paperless_chain/chunk_document
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          text:
            type: javascript
            expr: results.fetch.text
          summary:
            type: javascript
            expr: results.summarize.summary
          document_type_name:
            type: javascript
            expr: results.update.document_type_name
          document_language:
            type: javascript
            expr: results.fetch.document_language
    - id: embed
      summary: Generate embeddings
      value:
        type: script
        path: f/paperless_chain/generate_embeddings
        input_transforms:
          chunks:
            type: javascript
            expr: results.chunk.chunks
    - id: store
      summary: Store vectors in Qdrant
      value:
        type: script
        path: f/paperless_chain/store_qdrant
        input_transforms:
          embedded_chunks:
            type: javascript
            expr: results.embed.embedded_chunks
    - id: status_tag
      summary: Apply AI-Warning tag when processing had warnings
      value:
        type: script
        path: f/paperless_chain/apply_status_tags
        input_transforms:
          doc_id:
            type: javascript
            expr: results.fetch.doc_id
          update_warnings:
            type: javascript
            expr: results.update.warnings
          chunk_warnings:
            type: javascript
            expr: results.chunk.warnings
    - id: notify
      summary: Send warnings and status
      value:
        type: script
        path: f/paperless_chain/notify
        input_transforms:
          doc_id:
            type: javascript
            expr: results.update.doc_id
          title:
            type: javascript
            expr: results.update.title
          correspondent_name:
            type: javascript
            expr: results.update.correspondent_name
          document_type_name:
            type: javascript
            expr: results.update.document_type_name
          warnings:
            type: javascript
            expr: results.status_tag.warnings
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    doc_id:
      type: integer
      description: Paperless document ID (set by preprocessor from doc_url)
  required: []
