<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suche &middot; Paperless-chAIn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --pico-font-size: 16px; }

    .site-header {
      border-bottom: 1px solid var(--pico-muted-border-color);
      background: var(--pico-card-background-color);
    }
    .site-header nav { margin-bottom: 0; padding: 0.5rem 1rem; }
    .brand { text-decoration: none; font-size: 1.05rem; }
    .brand strong { color: var(--pico-primary); }
    .site-header nav ul li a[aria-current="page"] {
      color: var(--pico-primary);
      font-weight: 600;
    }
    .site-header nav ul:last-of-type { gap: 1.25rem; }

    .page-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem 0;
    }
    .page-header hgroup { margin-bottom: 0; }
    .page-header h1 { margin-bottom: 0.25rem; font-size: 1.5rem; }
    .page-header p { color: var(--pico-muted-color); margin-bottom: 0; }

    body > main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .filters select, .filters input[type="number"] { margin-bottom: 0; }
    .filters label { flex: 1; min-width: 140px; }
    #results { margin-top: 1.5rem; }
    #spinner {
      display: none;
      text-align: center;
      padding: 2rem 0;
      color: var(--pico-muted-color);
    }
    #spinner.htmx-request { display: block; }

    @media (max-width: 600px) {
      .site-header nav ul li { padding: 0; }
      .site-header nav ul:first-of-type li a { font-size: 1rem; }
    }
  </style>
</head>
<body>
  {% include '_nav.html' %}

  <section class="page-header">
    <hgroup>
      <h1>Suche</h1>
      <p>Semantische Suche in deinen Dokumenten</p>
    </hgroup>
  </section>

  <main class="container">
    <form hx-post="/search" hx-target="#results" hx-indicator="#spinner">
      <fieldset role="group">
        <input
          type="search"
          name="query"
          placeholder="Suchbegriff eingeben..."
          required
          autofocus
        >
        <button type="submit">Suchen</button>
      </fieldset>

      <details>
        <summary>Filter</summary>
        <div class="filters">
          <label>
            Korrespondent
            <select name="correspondent">
              <option value="">Alle</option>
              {% for c in correspondents %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            Tag
            <select name="tag">
              <option value="">Alle</option>
              {% for t in tags %}
              <option value="{{ t }}">{{ t }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            Chunk-Typ
            <select name="chunk_kind">
              <option value="">Alle</option>
              <option value="summary">Summary</option>
              <option value="chunk">Teil-Chunks</option>
            </select>
          </label>
          <label>
            Limit
            <input type="number" name="limit" value="20" min="1" max="100">
          </label>
        </div>
      </details>
    </form>

    <div id="spinner" class="htmx-indicator">
      <p aria-busy="true">Embedding wird erzeugt und Vektoren durchsucht...</p>
    </div>
    <div id="results"></div>
  </main>
</body>
</html>
