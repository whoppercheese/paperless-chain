<article id="entity-{{ e.id }}" class="entity-card type-{{ e.type }}{% if not e.description %} empty-description{% endif %}" data-name="{{ e.name|lower }}">
  <header>
    <strong>{{ e.name }}</strong>
    {% if e.paperless_id %}<small>ID {{ e.paperless_id }}</small>{% endif %}
  </header>
  <form hx-post="/entities/update"
        hx-target="closest article"
        hx-swap="outerHTML">
    <input type="hidden" name="entity_id" value="{{ e.id }}">
    <div class="form-row">
      <textarea name="description" rows="2" placeholder="Beschreibung eingeben...">{{ e.description }}</textarea>
      <button type="submit" class="outline save-btn" aria-label="Speichern">
        <svg class="save-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span class="save-spinner" aria-hidden="true"></span>
      </button>
    </div>
  </form>
</article>
