<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paperless-chAIn Entities</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --pico-font-size: 15px;
    }
    body > main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    h1 { margin-bottom: 0.25rem; }
    h2 { margin-bottom: 0.75rem; }
    h2 small { color: var(--pico-muted-color); font-weight: normal; }
    .subtitle { color: var(--pico-muted-color); margin-bottom: 1.5rem; }
    .nav {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nav a { text-decoration: none; }
    .section { margin-bottom: 2rem; }

    .entity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .entity-card { margin: 0; padding: 1rem; }
    .entity-card header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .entity-card header small { color: var(--pico-muted-color); }
    .entity-card.type-tag header strong { color: var(--pico-primary); }
    .entity-card.type-correspondent header strong { color: var(--pico-success); }
    .entity-card.type-document_type header strong { color: var(--pico-warning); }

    .entity-card textarea {
      margin-bottom: 0.75rem;
      min-height: 70px;
      font-size: 0.9rem;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
    }
    .save-btn {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .save-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .htmx-request .save-spinner { display: inline-block; }
    .htmx-request .save-label { display: none; }
    .htmx-request .save-btn {
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #message {
      padding: 0.75rem;
      background: var(--pico-success-background);
      border-radius: var(--pico-border-radius);
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .entity-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="nav">
      <a href="/">Suche</a>
      <a href="/entities">Entities</a>
    </nav>

    <h1>Entity Descriptions</h1>
    <p class="subtitle">Beschreibungen für semantisches Matching verwalten</p>

    {% if message %}
    <div id="message">{{ message }}</div>
    {% endif %}

    <form hx-post="/entities/sync" hx-target="body">
      <button type="submit" class="secondary">Jetzt synchronisieren</button>
    </form>
    <p><small>Sync läuft alle 5 Minuten automatisch in Windmill</small></p>

    <div id="entities-table">
      {% include 'entities_table.html' %}
    </div>
  </main>
</body>
</html>
